<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_ONLINE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #0ff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cyber-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 10s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 20, 20, 0.6);
            padding: 3rem 4rem;
            border: 1px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 4px;
        }

        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #0ff;
        }

        .container::before {
            top: -2px; left: -2px;
            border-right: none; border-bottom: none;
        }
        
        .container::after {
            bottom: -2px; right: -2px;
            border-left: none; border-top: none;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: glitch 1s linear infinite;
            position: relative;
            text-shadow: 2px 0 #f0f, -2px 0 #0ff;
        }

        p {
            font-size: 1.2rem;
            margin-top: 1rem;
            color: #aaa;
            letter-spacing: 2px;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #0f0;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
        
        .sys-log {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #0ff;
            opacity: 0.7;
            text-align: left;
        }

        .typing {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #0ff;
            animation: typing 3s steps(40, end), blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #0ff; }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="container">
        <h1><span class="status-dot"></span>SYS.ONLINE</h1>
        <p>A.I. BACKEND CLUSTER OPERATIONAL</p>
        
        <div class="sys-log">
            <div class="typing">> ROUTING SECURE DATA FOR HARRSH...</div>
        </div>
    </div>
</body>
</html>
